<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Transaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

    <script>
      // Same theme key as the rest of the app, so dark mode stays in sync across pages.
      (function () {
        var saved = localStorage.getItem("expenseTrackerTheme");
        if (saved === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <style>
      :root{
        --bg:            #F1F5F9;
        --card:          #FFFFFF;
        --primary:       #2563EB;
        --text:          #1E293B;
        --text-muted:    #64748B;
        --border:        #E2E8F0;

        --btn-add:       #16A34A;
        --btn-reset:     #64748B;

        --cat-food:          #F59E0B;
        --cat-groceries:     #16A34A;
        --cat-travel:        #2563EB;
        --cat-shopping:      #A855F7;
        --cat-entertainment: #EC4899;
        --cat-bills:         #DC2626;
        --cat-investment:    #0EA5E9;
        --cat-salary:        #0EA5E9;
        --cat-other:         #64748B;

        --radius: 12px;
        --shadow: 0 2px 10px rgba(30, 41, 59, 0.06);
        --shadow-hover: 0 10px 24px rgba(30, 41, 59, 0.10);
      }

      [data-theme="dark"]{
        --bg:            #0F172A;
        --card:          #1E293B;
        --primary:       #60A5FA;
        --text:          #F8FAFC;
        --text-muted:    #94A3B8;
        --border:        #334155;

        --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        --shadow-hover: 0 10px 24px rgba(0, 0, 0, 0.45);
      }
      [data-theme="dark"] .navbar{
        background: linear-gradient(135deg, #5B21B6, #7C3AED) !important;
      }
      [data-theme="dark"] .form-control,
      [data-theme="dark"] .form-select{
        background-color: var(--card);
        color: var(--text);
        border-color: var(--border);
      }
      [data-theme="dark"] .form-control:focus,
      [data-theme="dark"] .form-select:focus{
        box-shadow: 0 0 0 3px rgba(96, 165, 250, .22);
      }
      [data-theme="dark"] .btn-outline-secondary{
        color: var(--text-muted);
        border-color: var(--border);
      }
      [data-theme="dark"] .btn-outline-secondary:hover{
        background: var(--btn-reset);
        border-color: var(--btn-reset);
        color: #fff;
      }

      body{
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        transition: background .25s ease, color .25s ease;
      }

      h1, h5, .navbar-brand{
        font-family: "Poppins", sans-serif;
      }

      /* ---------- Navbar ---------- */
      .navbar{
        background: linear-gradient(135deg, #4F46E5, #7C3AED) !important;
        border-bottom: none;
        padding: .6rem 1.25rem !important;
        position: sticky;
        top: 0;
        z-index: 20;
        box-shadow: 0 2px 6px rgba(37, 99, 235, 0.12);
        transition: box-shadow .2s ease, background .25s ease;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: .5rem;
      }
      .navbar.scrolled{
        box-shadow: 0 4px 16px rgba(30, 41, 59, 0.18);
      }
      .navbar-brand{
        color: #fff !important;
        font-weight: 600;
        font-size: 1.05rem;
      }
      .navbar-brand i{ margin-right: .4rem; }
      .navbar .btn{ border-radius: 8px; font-weight: 500; font-size: .85rem; }
      .navbar .btn-success{ background: var(--btn-add); border-color: var(--btn-add); }
      .navbar .btn-outline-secondary{
        color: #fff;
        border-color: rgba(255,255,255,.55);
        background: transparent;
      }
      .navbar .btn-outline-secondary:hover{
        background: rgba(255,255,255,.15);
        border-color: #fff;
      }
      .navbar .nav-actions{
        display: flex;
        align-items: center;
        gap: .5rem;
        margin-left: auto;
      }

      /* ---------- Page wrap ---------- */
      .page-wrap{
        max-width: 640px;
        margin: 2.5rem auto;
        padding: 0 1rem;
      }

      .page-eyebrow{
        font-size: .75rem;
        font-weight: 600;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: .2rem;
      }
      .page-title{
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 1.25rem;
        display: flex;
        align-items: center;
        gap: .65rem;
      }
      .page-title-icon{
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #F59E0B, #EA580C);
        color: #fff;
        font-size: 1.05rem;
        flex-shrink: 0;
      }

      /* ---------- Form card ---------- */
      .form-card{
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.75rem;
        transition: transform .18s ease, box-shadow .18s ease, background .25s ease, border-color .25s ease;
        animation: fadeInUp .35s ease;
      }
      .form-card:hover{
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }
      @keyframes fadeInUp{
        from{ opacity: 0; transform: translateY(8px); }
        to{ opacity: 1; transform: translateY(0); }
      }

      .form-label{
        font-weight: 600;
        font-size: .82rem;
        color: var(--text);
        margin-bottom: .35rem;
      }

      .input-icon{
        position: relative;
      }
      .input-icon i{
        position: absolute;
        left: .8rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: .85rem;
        pointer-events: none;
      }
      .input-icon .form-control,
      .input-icon .form-select{
        padding-left: 2.2rem;
      }

      .form-control, .form-select{
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        padding: .55rem .8rem;
        font-size: .9rem;
        transition: border-color .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
      }
      .form-control:focus, .form-select:focus{
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
      }

      /* Category color dot, updates via JS to match the selected category's fixed color */
      #categoryDot{
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--cat-salary);
        margin-right: .4rem;
        transition: background .15s ease;
      }

      .mb-field{ margin-bottom: 1.1rem; }

      .row-2{
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      @media (max-width: 560px){
        .row-2{ grid-template-columns: 1fr; }
      }

      .form-actions{
        display: flex;
        justify-content: flex-end;
        gap: .6rem;
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
      }

      .transaction-toast-stack{ position:fixed; top:5.5rem; right:1rem; z-index:1080; width:min(360px,calc(100vw - 2rem)); }
      .transaction-toast{ padding:.85rem 1rem; margin-bottom:.6rem; border-radius:10px; box-shadow:0 12px 28px rgba(15,23,42,.20); font-weight:600; animation:toastIn .25s ease; }
      .transaction-toast.error{ background:#FEE2E2; border-left:4px solid #DC2626; color:#991B1B; }
      .transaction-toast.warning{ background:#FEF3C7; border-left:4px solid #D97706; color:#92400E; }
      .transaction-toast.success{ background:#DCFCE7; border-left:4px solid #16A34A; color:#166534; }
      .transaction-toast.info{ background:#DBEAFE; border-left:4px solid #2563EB; color:#1E40AF; }
      .transaction-toast.leaving{ animation:toastOut .2s ease forwards; }
      @keyframes toastIn{ from{opacity:0;transform:translateX(24px)} to{opacity:1;transform:translateX(0)} }
      @keyframes toastOut{ from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(24px)} }

      .btn{ border-radius: 8px; font-weight: 500; }
      .btn-primary{ background: var(--primary); border-color: var(--primary); }
      .btn-primary:hover{ background: #1D4ED8; border-color: #1D4ED8; }
      .btn-outline-secondary{ color: var(--btn-reset); border-color: var(--border); }
      .btn-outline-secondary:hover{ background: var(--btn-reset); border-color: var(--btn-reset); }

      @media (max-width: 700px){
        .navbar .nav-actions{ width: 100%; justify-content: flex-start; }
      }
    </style>
  </head>
  <body>

    <nav class="navbar" id="mainNavbar">
      <a class="navbar-brand" href="{% url 'mainpage' %}"><span class="brand-mark" aria-hidden="true"><i class="bi bi-graph-up-arrow"></i></span><span class="brand-name">Spendwise</span></a>

      <div class="nav-actions">
        <a href="{% url 'mainpage' %}" class="btn btn-success btn-sm">
          <i class="bi bi-house"></i> Mainpage
        </a>
        <a href="/transactions/" class="btn btn-success btn-sm">
          <i class="bi bi-list-ul"></i> Transaction List
        </a>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="themeToggle" title="Toggle dark mode">
          <i class="bi bi-moon-stars"></i>
        </button>
        <form class="d-flex mb-0" role="search">
          {% if request.user.is_authenticated %}
            <a href='/logout/' class="btn btn-outline-secondary btn-sm">Logout</a>
          {% else %}
            <a href='/login/' class="btn btn-success btn-sm">Login</a>
          {% endif %}
        </form>
      </div>
    </nav>

    <div class="page-wrap">

      <div class="page-eyebrow">Edit entry</div>
      <div class="page-title">
        <span class="page-title-icon"><i class="bi bi-pencil-fill"></i></span>
        Update Transaction
      </div>

      <div class="form-card">
        <form method="post">
          {% csrf_token %}

          <div class="mb-field">
            <label class="form-label" for="title">Title</label>
            <div class="input-icon">
              <i class="bi bi-pencil"></i>
              <input type="text" class="form-control" id="title" name="title" value="{{ task.title }}" required>
            </div>
          </div>

          <div class="row-2 mb-field">
            <div>
              <label class="form-label" for="amount">Amount (₹)</label>
              <div class="input-icon">
                <i class="bi bi-currency-rupee"></i>
                <input type="number" class="form-control" id="amount" name="amount" step="10" value="{{ task.amount }}" required>
              </div>
            </div>
            <div>
              <label class="form-label" for="date">Date</label>
              <div class="input-icon">
                <i class="bi bi-calendar3"></i>
                <input type="date" class="form-control" id="date" name="date" value="{{ task.date|date:'Y-m-d' }}">
              </div>
            </div>
          </div>

          <div class="row-2 mb-field">
            <div>
              <label class="form-label" for="types">Type</label>
              <select class="form-select" id="types" name="types" required>
                <option value="Income" {% if task.types == "Income" %}selected{% endif %}>Income</option>
                <option value="Expense" {% if task.types == "Expense" %}selected{% endif %}>Expense</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="category">
                <span id="categoryDot"></span>Category
              </label>
              <select class="form-select" id="category" name="category" required>
                <option value="{{ task.category }}">{{ task.category }}</option>
              </select>
            </div>
          </div>
          <div class="mb-field" id="customCategoryField" hidden>
            <label class="form-label" for="custom_category">Custom income category</label>
            <input type="text" class="form-control" id="custom_category" name="custom_category" maxlength="100" placeholder="e.g. Freelance work">
          </div>

          <div class="form-actions">
            <a href="{% url 'transactions' %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg"></i> Update Transaction
            </button>
          </div>

        </form>
      </div>

      {% if messages %}
        <div class="transaction-toast-stack" aria-live="polite">
          {% for message in messages %}
            <div class="transaction-toast {% if 'error' in message.tags %}error{% elif 'warning' in message.tags %}warning{% elif 'success' in message.tags %}success{% else %}info{% endif %}" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

    </div>

    <script>
      // ---- Dark mode toggle (persisted in localStorage, shared with other pages) ----
      const themeToggle = document.getElementById("themeToggle");
      const themeIcon = themeToggle.querySelector("i");
      function applyTheme(theme) {
        if (theme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          themeIcon.className = "bi bi-sun";
        } else {
          document.documentElement.removeAttribute("data-theme");
          themeIcon.className = "bi bi-moon-stars";
        }
      }
      applyTheme(localStorage.getItem("expenseTrackerTheme") || "light");
      themeToggle.addEventListener("click", function () {
        const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
        const next = current === "dark" ? "light" : "dark";
        applyTheme(next);
        localStorage.setItem("expenseTrackerTheme", next);
      });

      // Sticky navbar shadow only after scrolling (matches the rest of the app)
      const navbar = document.getElementById("mainNavbar");
      window.addEventListener("scroll", function () {
        navbar.classList.toggle("scrolled", window.scrollY > 4);
      });

      // Update the category color dot to match the selected category's fixed color,
      // consistent with the colors used in the mainpage's doughnut chart.
      const categoryColors = {
        Food: "var(--cat-food)",
        Groceries: "var(--cat-groceries)",
        Travel: "var(--cat-travel)",
        Shopping: "var(--cat-shopping)",
        Entertainment: "var(--cat-entertainment)",
        Bills: "var(--cat-bills)",
        Investment: "var(--cat-investment)",
        Salary: "var(--cat-salary)",
        Other: "var(--cat-other)"
      };
      const categorySelect = document.getElementById("category");
      const categoryDot = document.getElementById("categoryDot");
      function updateCategoryDot() {
        categoryDot.style.background = categoryColors[categorySelect.value] || "var(--cat-other)";
      }
      const typeSelect = document.getElementById("types");
      const customCategoryField = document.getElementById("customCategoryField");
      const customCategoryInput = document.getElementById("custom_category");
      const categories = {
        Income: ["Salary", "Other"],
        Expense: ["Food", "Groceries", "Travel", "Shopping", "Bills", "Entertainment", "Other"]
      };
      const existingCategory = "{{ task.category|escapejs }}";
      let customIncomeFromExisting = typeSelect.value === "Income" && !categories.Income.includes(existingCategory);
      function refreshCategories() {
        const isCustomIncome = customIncomeFromExisting && typeSelect.value === "Income";
        const selected = categorySelect.value;
        categorySelect.innerHTML = categories[typeSelect.value]
          .map(category => `<option value="${category}">${category}</option>`).join("");
        if (isCustomIncome) {
          categorySelect.value = "Other";
          customCategoryInput.value = existingCategory;
          customIncomeFromExisting = false;
        } else {
          categorySelect.value = categories[typeSelect.value].includes(selected) ? selected : categories[typeSelect.value][0];
        }
        const showCustom = typeSelect.value === "Income" && categorySelect.value === "Other";
        customCategoryField.hidden = !showCustom;
        customCategoryInput.required = showCustom;
        updateCategoryDot();
      }
      typeSelect.addEventListener("change", refreshCategories);
      categorySelect.addEventListener("change", refreshCategories);
      refreshCategories();
      document.querySelectorAll(".transaction-toast").forEach((toast) => {
        setTimeout(() => {
          toast.classList.add("leaving");
          setTimeout(() => toast.remove(), 200);
        }, 5000);
      });
    </script>

  </body>
</html>
